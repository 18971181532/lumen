[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-photonics"
version = "1.0.0"
description = "Hierarchical photonic integrated circuit S-parameter simulator (zero dependencies)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "遥か" }]
keywords = ["photonics", "integrated-photonics", "s-parameters", "circuit-simulation", "silicon-photonics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools]
packages = ["lumen"]

[tool.setuptools.package-data]
lumen = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
