<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#8ea0bd"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1160" height="900" fill="#0b1220"/>
  <text x="580" y="38" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Lumen 仿真流水线</text>
  <text x="580" y="62" fill="#8ea0bd" font-size="12" text-anchor="middle">从类 SPICE 网表到光谱、群延迟、S 矩阵与容差统计</text>

  <!-- netlist -->
  <rect x="390" y="86" width="380" height="82" rx="12" fill="#0e1626" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="580" y="112" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">网表文本 .dev</text>
  <text x="580" y="132" fill="#8ea0bd" font-size="11" text-anchor="middle">circuit / wavelength / source / monitor / port</text>
  <text x="580" y="150" fill="#8ea0bd" font-size="11" text-anchor="middle">wg · coupler · atten · mzi · ring · .sweep · .end</text>
  <line x1="580" y1="168" x2="580" y2="200" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- parser -->
  <rect x="390" y="204" width="380" height="72" rx="12" fill="#111a2c" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="580" y="229" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">netlist.py 解析与校验</text>
  <text x="580" y="249" fill="#8ea0bd" font-size="11" text-anchor="middle">SPICE 后缀 100u / 20n / 2.4k</text>
  <text x="580" y="265" fill="#8ea0bd" font-size="11" text-anchor="middle">端口数 · 保留字 @ · 耦合比范围 · 行号报错</text>
  <line x1="580" y1="276" x2="580" y2="308" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- hierarchy -->
  <rect x="390" y="312" width="380" height="76" rx="12" fill="#111a2c" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="580" y="337" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">circuit.py 层次展开</text>
  <text x="580" y="357" fill="#8ea0bd" font-size="11" text-anchor="middle">mzi / ring → 耦合器 + 波导原语</text>
  <text x="580" y="374" fill="#8ea0bd" font-size="11" text-anchor="middle">内部网 @arm1 · @r1a 自动隔离</text>
  <line x1="580" y1="388" x2="580" y2="420" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- assemble -->
  <rect x="390" y="424" width="380" height="76" rx="12" fill="#111a2c" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="580" y="449" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">逐波长组装线性系统</text>
  <text x="580" y="469" fill="#8ea0bd" font-size="11" text-anchor="middle">(I − S P) a = b ，网名合并端口</text>
  <text x="580" y="486" fill="#8ea0bd" font-size="11" text-anchor="middle">反馈环进入矩阵，不做迭代近似</text>
  <line x1="580" y1="500" x2="580" y2="532" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- solve -->
  <rect x="390" y="536" width="380" height="72" rx="12" fill="#111a2c" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="580" y="561" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">complexmatrix.py 复 LU 求解</text>
  <text x="580" y="581" fill="#8ea0bd" font-size="11" text-anchor="middle">部分主元 · O(n³) · 残差校验</text>
  <text x="580" y="597" fill="#8ea0bd" font-size="11" text-anchor="middle">所有端口场 a 一次得到</text>
  <line x1="580" y1="608" x2="580" y2="646" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- analysis -->
  <rect x="60" y="650" width="330" height="118" rx="12" fill="#0e1626" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="225" y="676" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">analysis.py 分析</text>
  <text x="225" y="697" fill="#8ea0bd" font-size="11" text-anchor="middle">光谱 · IL / ER / FSR / FWHM</text>
  <text x="225" y="715" fill="#8ea0bd" font-size="11" text-anchor="middle">相位解缠 · 群延迟 · 零点屏蔽</text>
  <text x="225" y="733" fill="#8ea0bd" font-size="11" text-anchor="middle">N 端口 S 矩阵 · 互易 / 酉性</text>
  <text x="225" y="751" fill="#5f7290" font-size="10" text-anchor="middle">spectrum / group / smatrix / run</text>

  <!-- tolerance -->
  <rect x="415" y="650" width="330" height="118" rx="12" fill="#0e1626" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="580" y="676" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">tolerance.py 蒙特卡洛</text>
  <text x="580" y="697" fill="#8ea0bd" font-size="11" text-anchor="middle">扰动 L / R · neff · k</text>
  <text x="580" y="715" fill="#8ea0bd" font-size="11" text-anchor="middle">自动对准最近谐振点</text>
  <text x="580" y="733" fill="#8ea0bd" font-size="11" text-anchor="middle">漂移 / 损耗 / 消光比分布</text>
  <text x="580" y="751" fill="#5f7290" font-size="10" text-anchor="middle">mean / std / P5 / P95 / histogram</text>

  <!-- layout + web -->
  <rect x="770" y="650" width="330" height="118" rx="12" fill="#0e1626" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="935" y="676" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">layout.py + server.py</text>
  <text x="935" y="697" fill="#8ea0bd" font-size="11" text-anchor="middle">BFS 分层 · 端口坐标 · 反馈边</text>
  <text x="935" y="715" fill="#8ea0bd" font-size="11" text-anchor="middle">SVG 原理图 · 六标签工作台</text>
  <text x="935" y="733" fill="#8ea0bd" font-size="11" text-anchor="middle">零依赖 HTTP JSON API</text>
  <text x="935" y="751" fill="#5f7290" font-size="10" text-anchor="middle">layout / serve</text>

  <line x1="480" y1="608" x2="225" y2="648" stroke="#8ea0bd" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="580" y1="608" x2="580" y2="648" stroke="#8ea0bd" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="680" y1="608" x2="935" y2="648" stroke="#8ea0bd" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="60" y="798" width="1040" height="58" rx="10" fill="#0a101c" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="821" fill="#8ea0bd" font-size="11">CLI</text>
  <text x="80" y="840" fill="#cbd5e1" font-size="11" font-family="monospace">parse · spectrum · group · smatrix · tolerance · layout · run · bench · serve</text>
  <text x="1080" y="840" fill="#5f7290" font-size="10" text-anchor="end">Python 3.9+ · zero dependencies · 74 tests</text>
</svg>
