name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke-test the CLI
        run: |
          lumen --version
          lumen spectrum examples/mzi.dev --start 1540 --stop 1560 --step 0.5
          lumen group examples/ring.dev --every 20
          lumen smatrix examples/smatrix.dev
          lumen tolerance examples/tolerance.dev --runs 20 --points 41
          lumen bench --stages 5 --points 31
